<section id="subscribe">
    <div class="container">
        <div class="subscribe-section fade-up">
            <h2>🚀 join the neural network 🚀</h2>
            <p>Subscribe to our newsletter and receive exclusive design insights, futuristic case studies, and early access — straight to your inbox. We'll send curated inspiration only for visionaries.</p>
            <form id="subscribeForm">
                <div class="form-group">
                    <input type="text" name="name" id="subName" placeholder="Your name *" required>
                    <input type="email" name="email" id="subEmail" placeholder="Your email *" required>
                    <button type="submit" class="subscribe-btn"><i class="fas fa-paper-plane"></i> Subscribe →</button>
                </div>
                <div id="formStatus" class="form-message"></div>
            </form>
            <p style="margin-top:1.5rem; font-size:0.8rem;">⚡ No spam — only futuristic design waves. Unsubscribe anytime.</p>
        </div>
    </div>
</section>
